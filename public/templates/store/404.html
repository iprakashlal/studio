<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Page not found</title>
<script>try{var b=localStorage.getItem("site-bg:"+location.pathname.replace(/[^/]*$/,""));if(b)document.documentElement.style.background=b;var x=sessionStorage.getItem("fx-exit");if(x){var c=x.charAt(0)=="{"?JSON.parse(x).bg:x;if(/^(#[0-9a-f]{3,8}|rgba?\([0-9., %]+\))$/i.test(c)){var s=document.createElement("style");s.id="fx-pre";s.textContent="html{background:"+c+"!important}body>*{visibility:hidden}";document.head.appendChild(s);setTimeout(function(){s.remove()},3500)}}}catch(e){}</script>
<script>
// Unknown addresses go back to the home page of this site.
(function(){var seg=location.pathname.split("/").filter(Boolean);var base=/\.github\.io$/i.test(location.hostname)&&seg.length&&!/\.\w+$/.test(seg[0])?"/"+seg[0]+"/":"/";location.replace(base)})();
</script></head>
<body style="font-family:system-ui,sans-serif;padding:24px">Taking you to the home page… <a href="./">Continue</a></body></html>
